name: Actualizar catálogo y publicar

# Este MISMO archivo hace dos cosas:
#  1) La primera vez, si encuentra un .zip en la raíz del repositorio, lo descomprime e instala el proyecto.
#  2) Siempre: actualiza los catálogos, verifica los enlaces, genera las listas y publica la app en GitHub Pages.
#
# Si iptv-org no responde desde el servidor de GitHub (corte temporal), la corrida termina en VERDE pero
# NO publica: queda en línea la versión anterior. Si el catálogo es incoherente o aparecen claves, termina en ROJO.

on:
  schedule:
    - cron: "0 7 * * 1"      # todos los lunes, 07:00 UTC
  workflow_dispatch:          # botón "Run workflow" (se puede tocar desde Chrome en el celular)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      publish: ${{ steps.guard.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar el proyecto desde el ZIP (solo la primera vez)
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No hay ZIP en la raíz: se usa el contenido que ya está en el repositorio."
            exit 0
          fi
          echo "Instalando desde ${zips[0]}"
          rm -rf _unz
          python -m zipfile -e "${zips[0]}" _unz
          tools_dir="$(find _unz -type d -name tools -print -quit)"
          if [ -z "$tools_dir" ]; then
            echo "::error::El ZIP no contiene la carpeta tools/. Subiste el ZIP equivocado?"
            exit 1
          fi
          src="$(dirname "$tools_dir")"
          # Los workflows no los puede escribir el robot (limitación de GitHub). El tuyo ya está pegado a mano.
          rm -rf "$src/.github"
          cp -a "$src"/. .
          rm -rf _unz "${zips[0]}"
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add -A
          git commit -m "Instalar proyecto desde el ZIP" || true
          git push

      - name: Guardia de seguridad (configuración y datos manuales)
        run: python tools/guard.py security --source

      - name: Limpiar datos de prueba antes de construir
        run: |
          rm -rf public/data public/lists public/stremio
          mkdir -p public/data public/lists

      - name: Pruebas automáticas (sin internet)
        run: python -m unittest discover -s tests

      - name: Canales en vivo (iptv-org). Si la API no responde, no frena la corrida
        run: python tools/build_live.py

      - name: Películas y series (si falla, el resto sigue)
        continue-on-error: true
        run: python tools/build_movies.py

      - name: Verificar enlaces (un enlace roto nunca frena el resto)
        run: python tools/verify.py public/data/live.json public/data/movies.json public/data/series.json

      - name: Guardia de calidad del catálogo
        id: guard
        run: python tools/guard.py catalogs --strict

      - name: Exportar listas M3U y add-on de Stremio
        if: steps.guard.outputs.publish == 'true'
        run: |
          python tools/export_m3u.py
          python tools/build_stremio.py

      - name: Guardia de calidad de las listas M3U
        if: steps.guard.outputs.publish == 'true'
        run: python tools/guard.py lists

      - name: Guardia de seguridad (archivos que se van a publicar)
        if: steps.guard.outputs.publish == 'true'
        run: python tools/guard.py security --public

      - name: Resumen de la corrida
        if: always()
        run: |
          {
            echo '### Informe de la actualización'
            if [ "${{ steps.guard.outputs.publish }}" = "false" ]; then
              echo '**Esta vez NO se publicó nada** (corte externo temporal). Sigue en línea la versión anterior. Reintentá con Run workflow.'
            fi
            echo '```json'
            if [ -f public/data/report.json ]; then cat public/data/report.json; else echo '{"aviso": "No se generó report.json: la corrida se cortó antes de la guardia."}'; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar historial de verificación
        if: steps.guard.outputs.publish == 'true'
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || (git commit -m "Actualizar historial de verificación" && git push)

      - name: Preparar GitHub Pages
        if: steps.guard.outputs.publish == 'true'
        uses: actions/configure-pages@v5

      - name: Subir la carpeta public
        if: steps.guard.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
